name: Build Plugin ZIP on PR Merge

on:
  pull_request:
    types: [closed]

jobs:
  build-zip:
    # Only runs when the PR is merged, not merely closed.
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create plugin ZIP
        run: |
          PLUGIN_SLUG="fsweb-comments-core"
          ZIP_NAME="${PLUGIN_SLUG}.zip"
          BUILD_DIR="/tmp/build/${PLUGIN_SLUG}"

          # WordPress expects the archive to contain a single plugin folder:
          #   fsweb-comments-core.zip
          #   └── fsweb-comments-core/
          mkdir -p "${BUILD_DIR}"

          rsync -a ./ "${BUILD_DIR}/" \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.gitignore' \
            --exclude='.gitattributes' \
            --exclude='.editorconfig' \
            --exclude='.DS_Store' \
            --exclude='Thumbs.db' \
            --exclude='CHANGELOG.md' \
            --exclude='AGENTS.md' \
            --exclude='ROADMAP.md' \
            --exclude='reasonix.toml' \
            --exclude='.reasonix/' \
            --exclude='*.zip' \
            --exclude='node_modules/' \
            --exclude='.vscode/' \
            --exclude='.idea/' \
            --exclude='.distignore' \
            --exclude='tests/' \
            --exclude='composer.json' \
            --exclude='composer.lock' \
            --exclude='phpunit.xml.dist' \
            --exclude='.phpunit.result.cache' \
            --exclude='vendor/' \
            --exclude='PROMPT.md' \
            --exclude='languages/*.po' \
            --exclude='languages/*.mo'

          cd /tmp/build
          zip -r "${GITHUB_WORKSPACE}/${ZIP_NAME}" "${PLUGIN_SLUG}"

          echo "ZIP criado: ${ZIP_NAME}"
          ls -lh "${GITHUB_WORKSPACE}/${ZIP_NAME}"

      - name: Upload ZIP as artifact
        uses: actions/upload-artifact@v4
        with:
          name: fsweb-comments-core
          path: fsweb-comments-core.zip
          retention-days: 30

      - name: Extract plugin version
        id: version
        run: |
          VERSION=$(grep -oP 'Version:\s*\K[0-9]+\.[0-9]+\.[0-9]+' fsweb-comments-core.php)
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Versão detectada: ${VERSION}"

      - name: Extract changelog
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          if [ -f CHANGELOG.md ]; then
            CHANGELOG="$(awk -v v="${VERSION}" '
              index($0, "## " v " ") == 1 || index($0, "## [" v "]") == 1 { print "###" substr($0, 2); found=1; next }
              found && index($0, "## ") == 1 { exit }
              found { print }
            ' CHANGELOG.md)"
          else
            CHANGELOG=""
          fi
          if [ -z "${CHANGELOG}" ]; then
            CHANGELOG="- No changelog entry found for v${VERSION}."
          fi
          {
            echo "CHANGELOG<<EOF"
            echo "${CHANGELOG}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create Release
        if: github.event.pull_request.base.ref == 'main' || github.event.pull_request.base.ref == 'master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: v${{ steps.version.outputs.VERSION }}
          body: |
            # 💬 FSWEB Comments Core v${{ steps.version.outputs.VERSION }}

            Free edition — lightweight review and feedback management for WordPress.

            ## ✨ Features

            - 🧾 **Reviews CPT** with categories and moderation queue
            - ⭐ **Star ratings** and photo support
            - 🧩 **`[fsweb_reviews]`** shortcode with grid and list layouts
            - ✍️ **`[fsweb_review_form]`** shortcode with AJAX submission
            - 📊 Admin overview with average rating and pending counter

            ## 🔖 Changelog

            ${{ steps.changelog.outputs.CHANGELOG }}

            ---

            Build gerado automaticamente a partir do PR #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}
            **Branch:** ${{ github.event.pull_request.head.ref }} → ${{ github.event.pull_request.base.ref }}
            **Commit:** ${{ github.event.pull_request.merge_commit_sha }}
          files: fsweb-comments-core.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
