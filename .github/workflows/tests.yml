name: Tests

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  phpunit:
    name: PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: fsweb_cc_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    strategy:
      matrix:
        php: ['7.4', '8.2']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress

      - name: Download WordPress
        run: |
          curl -sSL -o /tmp/wordpress.tar.gz https://wordpress.org/latest.tar.gz
          mkdir -p /tmp/wp
          tar -xzf /tmp/wordpress.tar.gz -C /tmp/wp --strip-components=1

      - name: Prepare the test site
        env:
          WP_TEST_ROOT: /tmp/wp
          WP_TEST_DB: fsweb_cc_test
          WP_TEST_DB_USER: root
          WP_TEST_DB_PASSWORD: root
          WP_TEST_DB_HOST: 127.0.0.1
        run: |
          mkdir -p /tmp/wp/wp-content/plugins
          ln -s "$GITHUB_WORKSPACE" /tmp/wp/wp-content/plugins/fsweb-comments-core
          php tests/bin/install-wp-tests.php

      - name: Run PHPUnit
        env:
          WP_TEST_ROOT: /tmp/wp
          WP_TEST_DB: fsweb_cc_test
          WP_TEST_DB_USER: root
          WP_TEST_DB_PASSWORD: root
          WP_TEST_DB_HOST: 127.0.0.1
        run: vendor/bin/phpunit --no-coverage

  plugin-check:
    name: Plugin Check
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: pc
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Install WP-CLI
        run: |
          curl -sSL -o /tmp/wp-cli.phar https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          chmod +x /tmp/wp-cli.phar

      - name: Install WordPress and Plugin Check
        run: |
          /tmp/wp-cli.phar core download --path=/tmp/pc --version=latest --skip-content
          /tmp/wp-cli.phar config create --path=/tmp/pc --dbname=pc --dbuser=root --dbpass=root --dbhost=127.0.0.1 --skip-check
          /tmp/wp-cli.phar core install --path=/tmp/pc --url=http://example.org --title=PluginCheck --admin_user=admin --admin_password=admin --admin_email=admin@example.org --skip-email
          /tmp/wp-cli.phar plugin install plugin-check --activate --path=/tmp/pc

      # Check what ships, not the repository: the same excludes used by
      # build-zip.yml. Otherwise tests/, phpunit.xml.dist and the hidden files
      # fail the job for files the package never contains.
      - name: Build the distributable package
        run: |
          BUILD_DIR="/tmp/pc/wp-content/plugins/fsweb-comments-core"
          mkdir -p "${BUILD_DIR}"
          rsync -a ./ "${BUILD_DIR}/" \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.gitignore' \
            --exclude='.gitattributes' \
            --exclude='.editorconfig' \
            --exclude='.DS_Store' \
            --exclude='Thumbs.db' \
            --exclude='CHANGELOG.md' \
            --exclude='AGENTS.md' \
            --exclude='ROADMAP.md' \
            --exclude='reasonix.toml' \
            --exclude='.reasonix/' \
            --exclude='*.zip' \
            --exclude='node_modules/' \
            --exclude='.vscode/' \
            --exclude='.idea/' \
            --exclude='.distignore' \
            --exclude='tests/' \
            --exclude='composer.json' \
            --exclude='composer.lock' \
            --exclude='phpunit.xml.dist' \
            --exclude='.phpunit.result.cache' \
            --exclude='vendor/' \
            --exclude='PROMPT.md' \
            --exclude='languages/*.po' \
            --exclude='languages/*.mo'

      - name: Run Plugin Check
        run: |
          /tmp/wp-cli.phar plugin check fsweb-comments-core \
            --path=/tmp/pc \
            --format=table
